# Cosmos DB Config
spring.data.mongodb.database=${COSMOS_DB_DATABASE}
spring.data.mongodb.uri=${COSMOS_DB_URI}
spring.data.mongodb.username=${COSMOS_DB_USERNAME}
spring.data.mongodb.password=${COSMOS_DB_PASSWORD}

# Event Hub Config
#spring.cloud.stream.

# Transaction Config
transaction.code.get=${TRANSACTION_CODE_GET:002}
transaction.code.save=${TRANSACTION_CODE_POST:102}
transaction.code.update=${TRANSACTION_CODE_PUT:202}
transaction.code.delete=${TRANSACTION_CODE_DELETE:302}

# Logging Config
logging.level.com.azure=WARN